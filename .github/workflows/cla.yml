name: CLA

# Asks first-time contributors to sign CLA.md, and records the signature in a
# committed file. Without this, the dual-licence option in CLA.md §2 is only a
# claim — nothing would prove a contributor ever agreed to it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit behind the v2.6.1 tag, so a moved or hijacked tag cannot change what runs.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        # Runs only on the sign-request comment or on a PR event, so ordinary
        # issue comments don't spin up a job.
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/rajnsingh99/devgentic/blob/main/CLA.md'
          branch: 'main'
          allowlist: rajnsingh99,bot*
          custom-notsigned-prcomment: 'Thanks for the contribution. Before it can be merged, please read [the CLA](https://github.com/rajnsingh99/devgentic/blob/main/CLA.md) and post the sentence below as a comment on this PR. One signature covers all your future contributions.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
